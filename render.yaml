# ===================================================================
# render.yaml — Configuración de despliegue automático en Render
# ===================================================================

services:
  - type: web
    name: agente-tributario-autonomo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .

    envVars:
      # IMPORTANTE: añadir manualmente la clave en el panel de Render
      # https://console.groq.com → API Keys 
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: llama-3.1-8b-instant
      - key: LLM_PROVIDER
        value: auto
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: APP_MODE
        value: production
      - key: MAX_RETRIEVAL_DOCS
        value: "4"
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "800"
      # Streamlit: configuración para producción tras proxy
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"