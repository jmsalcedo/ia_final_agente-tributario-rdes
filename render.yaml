# ===================================================================
# render.yaml — Configuración de despliegue automático en Render
# Conecta este repo en https://dashboard.render.com como Web Service
# y Render detectará este archivo automáticamente.
# ===================================================================

services:
  - type: web
    name: ia_final_agente-tributario-rdes
    runtime: docker
    plan: free
    region: frankfurt          # Cambiar a oregon/singapore según preferencia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    envVars:
      # IMPORTANTE: añadir manualmente la clave en el panel de Render
      # https://console.groq.com → API Keys
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL_ID
        value: llama-3.1-8b-instant
      - key: LLM_PROVIDER
        value: auto
      - key: EMBEDDING_MODEL
        value: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - key: APP_MODE
        value: production
      - key: MAX_RETRIEVAL_DOCS
        value: "4"
      - key: LLM_TEMPERATURE
        value: "0.3"
      - key: LLM_MAX_TOKENS
        value: "800"
