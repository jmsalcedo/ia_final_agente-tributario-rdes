version: "3.9"

services:
  agente-tributario:
    build: .
    container_name: ia_final_agente-tributario-rdes
    ports:
      # Puerto 7860 para coherencia con HF Spaces
      - "7860:7860"
    env_file:
      - .env
    volumes:
      # Persistir índice vectorial entre reinicios
      - ./chroma_db:/app/chroma_db
      # Persistir datos procesados
      - ./data:/app/data
      # Persistir logs
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s